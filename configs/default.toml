# Cấu hình duy nhất. Muốn thử cấu hình khác: copy file này rồi chạy với  --config đường_dẫn.

[data]
fold_k = 5

[det]                        # YOLOv8 + SliceTrain (công thức của đội thắng 2025 / README baseline)
weights = "yolov8l.pt"       # điểm xuất phát (pretrained). Dùng yolov8s.pt khi thử nhanh hoặc VRAM nhỏ
tile = 1280
overlap = 0.2
frame_step = 3               # lấy 1/3 số frame train (frame liên tiếp gần như trùng nhau)
val_frame_step = 15
neg_ratio = 0.3              # tile nền / tile có chim
imgsz = 1280
epochs = 200
batch = 8
lr0 = 0.001
weight_decay = 0.01
close_mosaic = 15
infer_scale = 1.0            # suy luận full-frame ở kích thước gốc x infer_scale
conf = 0.05                  # thấp để tracker còn dùng được hộp conf thấp (giai đoạn 2)
nms_iou = 0.15
infer_weights = ""           # trống = models/det_final.pt

[track1]                     # theo YOLOv8-SMOT; tham số cần chọn lại bằng CV
hi = 0.25
lo = 0.05
new = 0.25
sim_thr = 0.25
sim_thr_low = 0.17
ema = 0.8
expand = 2.0
max_age = 30
min_len = 5
interp_gap = 10

[track2]                     # cửa sổ chỉ 60 frame: thiên về recall, chấp nhận track ngắn
hi = 0.25
lo = 0.05
new = 0.25
sim_thr = 0.25
sim_thr_low = 0.17
ema = 0.8
expand = 2.0
max_age = 30
min_len = 5
interp_gap = 10

[pred]
weights = "pred.pt"          # trong models/
stride = 5                   # bước cửa sổ khi huấn luyện
epochs = 40
tau = 0.2                    # phát dự đoán khi p(còn thấy) >= tau; tinh chỉnh bằng eval-pred
